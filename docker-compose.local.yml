# OPTIONAL local infrastructure for the capabilities the platform ships: RabbitMQ and Oracle.
# The default build (`mvn verify`) NEVER requires this. Use it for:
#   - manual runs of examples and labs against a real broker and database
#   - poking at infra while developing the platform
# @Tag("docker") tests use Testcontainers and manage their OWN containers - not this file.
#   up:   docker compose -f docker-compose.local.yml up -d            (or name one service: ... up -d rabbitmq)
#   down: docker compose -f docker-compose.local.yml down -v
# Kafka, Redis, Postgres, Vault and LocalStack were removed with the capabilities that used them
# (Spring-native plan v2 scope cut).
services:

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]   # mgmt UI: http://localhost:15672 guest/guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  oracle:
    # Oracle Database Free, the image the platform's Oracle tests use. The heaviest container here: give
    # Docker at least 2 GB for it. First start takes about a minute; the healthcheck waits for it.
    image: gvenzl/oracle-free:23-slim-faststart
    ports: ["1521:1521"]                  # jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    environment:
      ORACLE_PASSWORD: local-dev-only     # SYS/SYSTEM password, dev only; never mirror this pattern in prod
      APP_USER: app
      APP_USER_PASSWORD: app
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
