# Startup budget baseline for example-golden-path (phase-15 deliverable C).
#
# StartupBudgetTest fails if a cold context boot exceeds this baseline by more than 15%. The number is
# a governance artifact, not a ratchet: raise it ONLY with a deliberate commit that explains why the
# service legitimately got slower to start (a new starter, a heavier migration). Never bump it just to
# silence a red test — that is the regression this guard exists to catch.
#
# Measured on a developer laptop with web=NONE; CI should re-baseline for its own hardware.
startup.baseline.ms=15000
