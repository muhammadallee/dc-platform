#set( $featureSet = ",${features}," )
# ${artifactId} — service configuration.
#
# The platform sets sensible defaults for everything under dc.platform.* (see /actuator/env, the
# property sources named platform-*-defaults). Set a key here ONLY to deviate from a default —
# do not copy platform defaults in "to be safe". Disable a capability with dc.platform.<cap>.enabled=false.

spring:
  application:
    name: ${artifactId}

# Profiles: local (developer laptop, human-readable logs), test (CI slices), prod (real infrastructure).
---
# Every profile EXCEPT prod (including no profile at all): offline-friendly development defaults. None of
# these reach a prod start, so a deployment that forgets its real coordinates fails fast at startup
# instead of running on placeholders.
spring:
  config:
    activate:
      on-profile: "!prod"
  security:
    oauth2:
      resourceserver:
        jwt:
          # Identity provider JWKS endpoint. Placeholder so the app boots offline (decoding is lazy, so
          # this URL is never fetched until a request presents a token). To call authenticated endpoints
          # locally, override it with your IdP's (or a local test issuer's) JWKS URL.
          jwk-set-uri: https://example.test/.well-known/jwks.json

dc:
  platform:
    security:
      # Open endpoints (no authentication). Health/info/openapi are open by platform default; outside
      # prod the platform capability report is opened too, so local runs and the golden path can read
      # it. In prod it falls back to the platform default list (authenticated).
      permit-paths:
        - /actuator/health
        - /actuator/health/**
        - /actuator/info
        - /actuator/platform
        - /v3/api-docs/**
        - /swagger-ui/**
        - /swagger-ui.html
#if($featureSet.contains(",restclient,"))

app:
  greeting:
    # Downstream the GreetingClient sample calls. Loopback placeholder for local runs only; prod must
    # supply app.greeting.base-url (startup fails without it).
    base-url: http://localhost:8081
#end

---
spring:
  config:
    activate:
      on-profile: local

---
spring:
  config:
    activate:
      on-profile: test

---
spring:
  config:
    activate:
      on-profile: prod
#if($featureSet.contains(",data,"))
  datasource:
    # No embedded (H2) fallback in prod: startup fails unless spring.datasource.url (+ credentials) is
    # supplied by the environment or the secrets source.
    embedded-database-connection: none
#end
# In prod, supply the identity provider (spring.security.oauth2.resourceserver.jwt.jwk-set-uri or
# issuer-uri) and every datasource/downstream/broker coordinate externally (environment or the platform
# secrets property source), never in this file. A missing value fails startup with an actionable message.
