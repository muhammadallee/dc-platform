# Hibernate Validator aggregates every ContributorValidationMessages.properties on the classpath,
# so these defaults resolve even WITHOUT platform-validation-autoconfigure, and applications can
# still override per-key in their own ValidationMessages.properties.
dc.platform.validation.NotBlankTrimmed.message=must contain non-whitespace characters
dc.platform.validation.Ulid.message=must be a valid ULID (26 Crockford base32 characters)
dc.platform.validation.SafeText.message=must not contain control characters
dc.platform.validation.FutureInstant.message=must be an instant in the future
