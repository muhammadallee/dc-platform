# Platform layer of validation messages: consulted FIRST by the platform validator's
# interpolator; missing keys fall through to ContributorValidationMessages (shipped in
# platform-validation-api), the application's ValidationMessages, then hibernate defaults.
# Override per key in your application's own message source or ValidationMessages.properties.
dc.platform.validation.NotBlankTrimmed.message=must contain non-whitespace characters
dc.platform.validation.Ulid.message=must be a valid ULID (26 Crockford base32 characters)
dc.platform.validation.SafeText.message=must not contain control characters
dc.platform.validation.FutureInstant.message=must be an instant in the future
